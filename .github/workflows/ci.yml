# ═══════════════════════════════════════════════════════════════
#   Volt — CI
#   Runs ALL of the self-test gates on every push (any branch) and
#   every pull request:
#
#     1. Launcher integrity   (npm run check:launchers)
#        static cmd.exe parse-hazard rules + REAL cmd.exe parse
#        runs in a throwaway sandbox (Windows only — which is why
#        this job runs on windows-latest) + the hidden-console VBS
#        wrapper checks. Catches the ".cmd died silently" bug class.
#
#     2. Unit tests           (npm run test:utils)       118 tests
#        pure helpers: markdown, RAG chunking, focus-trap wrap,
#        window-state, the launcher/VBS static rules themselves.
#
#     3. Office export        (npm run test:office)       53 tests
#        CRC32, the store-only ZIP writer, DOCX/XLSX structure,
#        table/line detection.
#
#     4. File watcher         (npm run test:watch)         9 tests
#        the poll-based reload watcher (fire rules, stability
#        delay, debounce, restart-on-error).
#
#     5. Vendor integrity     (npm run check:vendor)
#        vendored pdf.js / pdf-lib / Tesseract verify against the
#        recorded versions + an Electron smoke — no downloads, the
#        CI/manual check mode of update-vendor.mjs.
#
#     6. PWA render smoke     (npm run smoke:browser:headless)
#        the full render + hidden-contract + modal probes with the
#        window loading WITHOUT the preload bridge — the exact
#        context a browser/PWA tab gets (--smoke-browser). Headless
#        (--smoke-no-focus) because the OS-focus-dependent real-
#        keyboard stage is the one thing a VM/CI session can't do.
#
#     7. Artifact regression  (npm run test:artifacts)
#        the sw.js cache-name / index.html ?v= stamp generator guard.
#        It ALSO runs the Electron smoke twice (negative with stale
#        artifacts, positive after regeneration) in --smoke-no-focus
#        mode — so the full render chain + preload bridge + focus
#        trap are covered here without OS focus.
#
#   A fourth, slower gate (release-feed job) runs the auto-update
#   round-trip end-to-end: it builds the installer, publishes a
#   scratch release feed (latest.yml + installer) over localhost,
#   launches the packaged app against it, and asserts the version
#   banner appears — the real electron-updater detect → download →
#   banner chain, not a stub. Windows-only and a few minutes (the
#   NSIS build dominates); see scripts/test-release-feed.mjs. With a
#   cert secret configured the build is SIGNED and the gate also
#   proves the updater's publisher verification; sign:check gates the
#   output either way (soft-skip without a cert).
#
#   Install note: dependencies are installed with --ignore-scripts
#   and the Electron binary is fetched explicitly. electron-builder
#   (a devDependency the tests never invoke) runs a postinstall that
#   downloads winCodeSign, which is a known CI flake; skipping it
#   keeps the gate hermetic.
#   ═══════════════════════════════════════════════════════════════
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: All self-test gates
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pdf-viewer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # repo-root-relative — the lockfile lives under pdf-viewer/
          cache-dependency-path: pdf-viewer/package-lock.json

      - name: Install dependencies (no postinstall scripts)
        run: npm ci --no-audit --no-fund --ignore-scripts

      # Restore the Electron binary BEFORE install.js runs — after npm ci
      # has wiped node_modules — so an unchanged lockfile reuses the cached
      # dist instead of re-downloading ~110 MB on every push.
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: node_modules/electron/dist
          # hashFiles is repo-root-relative too — a non-existent file makes
          # the key constant and would reuse a stale Electron binary
          key: electron-${{ runner.os }}-${{ hashFiles('pdf-viewer/package-lock.json') }}

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Launcher integrity (static rules + real cmd.exe parse runs)
        run: npm run check:launchers

      - name: Unit tests (utils, markdown, chunking, window-state, launcher rules, VBS)
        run: npm run test:utils

      - name: Office export unit tests (CRC32, ZIP, DOCX/XLSX, tables)
        run: npm run test:office

      - name: File-watcher unit tests
        run: npm run test:watch

      - name: Vendor integrity (vendored pdf.js / pdf-lib / Tesseract + smoke)
        # --no-focus: the vendor smoke defaults to the FOCUSED --smoke, whose
        # real-keyboard stage can't work on a VM — same rule as the rest of
        # the battery (the focused smoke stays a local/desktop check)
        run: npm run check:vendor -- --no-focus

      - name: PWA render smoke (no preload bridge, headless)
        run: npm run smoke:browser:headless

      - name: Artifact-generator regression guard (runs the Electron smoke headless)
        run: npm run test:artifacts

  release-feed:
    name: Release-feed round-trip (update → banner)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pdf-viewer
    # NO signing env here, deliberately: this job builds UNSIGNED so the
    # round-trip is deterministic (a configured cert would arm the updater's
    # publisher check, and its untrusted chain would fail CI). The SIGNED
    # round-trip is covered by the release workflow with a real cert — if one
    # is ever configured here, re-add CSC_LINK / CSC_KEY_PASSWORD env keys.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # repo-root-relative — the lockfile lives under pdf-viewer/
          cache-dependency-path: pdf-viewer/package-lock.json

      - name: Install dependencies (no postinstall scripts)
        run: npm ci --no-audit --no-fund --ignore-scripts

      # Same Electron cache dance as the checks job: restore BEFORE
      # install.js runs, so an unchanged lockfile skips the ~110 MB fetch.
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: node_modules/electron/dist
          # hashFiles is repo-root-relative too — a non-existent file makes
          # the key constant and would reuse a stale Electron binary
          key: electron-${{ runner.os }}-${{ hashFiles('pdf-viewer/package-lock.json') }}

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      # Builds the NSIS installer (--publish never), publishes a scratch
      # generic-provider feed, serves it over 127.0.0.1, launches the
      # packaged app with --smoke-feed + VOLT_UPDATE_URL, and asserts the
      # version banner — the full electron-updater chain, for real.
      - name: Release-feed round-trip (build → publish → install → banner)
        run: npm run test:release-feed -- --build

      # With a cert secret set: fail unless Volt.exe, the installer, and the
      # app-update.yml publisherName all verify signed. Without it: soft-skip.
      - name: Verify signed artifacts (soft-skips without a cert secret)
        run: npm run sign:check
